releaseNotes: |-
  # v0.0.4 更新说明

  > 本版本是应用更名为 **RobinDone（知更鸟搞定了）** 后的第一个版本。知更鸟吉祥物与产品定位不变——
  > 通用型常驻自动化 Harness：多智能体 + 触发器、事件驱动、项目全天候运转。
  >
  > **本次发布包含强制更新**：v0.0.1–v0.0.3 的存量安装会引导升级到本版本。

  ## 本次更名你需要知道的

  - **应用名 RobinRun → RobinDone**，安装后的程序名、数据目录、快捷方式随之更新。首次启动新版时，
    旧版本的全部本地数据（项目、智能体、会话、触发器、设置）会**自动搬迁**到新数据目录，无需手动操作。
  - 知更鸟图标与产品形态完全不变。
  - **回滚提示**：升级后如退回 v0.0.3 及更早版本，旧版本会因找不到旧数据目录而当作全新安装
    （数据并未丢失，仍保留在 RobinDone 数据目录中，重新升级即恢复）。

  ## 重要变化（影响手动配置，请留意）

  - **触发器脚本 API 更名**：Python 触发器脚本中的 `robinrun.emit(...)` / `robinrun.login_failed(...)`
    更名为 `robindone.emit(...)` / `robindone.login_failed(...)`。旧写法在新版本会直接报错，
    请更新你已编写的触发器脚本（引擎会把调用失败置为 error-paused 并通知，改完重启脚本即可恢复）。
  - **环境变量前缀更名**：`ROBINRUN_*` 全部更名为 `ROBINDONE_*`。常用对照：
    - `ROBINRUN_PYTHON_RUNTIME_MIRROR` → `ROBINDONE_PYTHON_RUNTIME_MIRROR`
    - `ROBINRUN_DATA_BASE_DIR` → `ROBINDONE_DATA_BASE_DIR`（如你设置过旧名，新版首启会自动沿用旧值，无需操作）
    - 其余 `ROBINRUN_DESKTOP_*` 等同理加前缀替换。
  - **深链协议更名**：`robinrun://` → `robindone://`（仅影响通过外部方式拉起协议回调的高级用法；
    应用内功能不依赖旧协议）。

  ## 改进

  - 数据迁移在启动加载屏内完成（「正在更新任务索引」），迁移期间智能体分组、worker 编制、
    触发器注册表、会话历史与全部设置原样保留。
  - 触发器附件、会话引用与已装插件在升级后继续可用（旧数据引用自动识别）。
  - 仓库与发布渠道更名为 RobinDone（GitHub 仓库 hqyaimer/RobinDone，旧链接自动跳转）。